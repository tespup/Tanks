<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Блокируем масштабирование, скроллинг и учитываем безопасные зоны (челку) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ТАНКИ 8-БИТ · TELEGRAM EDITION</title>
    <!-- Подключаем API Telegram Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/press-start-2p@5.0.20/400.css">
    <style>
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            touch-action: none; /* Отключаем системные жесты (свайпы, зум) */
            user-select: none; -webkit-user-select: none; 
        }
        html, body { 
            /* Используем стабильную высоту от Telegram, если она доступна */
            height: var(--tg-viewport-stable-height, 100vh); 
            width: 100%; 
            background: #000; 
            overflow: hidden; 
        }
        body {
            background: radial-gradient(circle at 50% 30%, #1b2140 0%, #0a0c18 70%);
            display: flex; flex-direction: row; align-items: center; justify-content: space-between;
            font-family: 'Press Start 2P', monospace;
        }
        
        /* Боковые панели для виртуального управления */
        .controls {
            width: 160px; height: 100%; 
            display: flex; align-items: center; justify-content: center; 
            position: relative; z-index: 10;
        }
        
        /* Контейнер игры по центру */
        #wrap { 
            position: relative; height: 100%; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            flex: 1; 
        }
        canvas {
            display: block; background: #000; border: 4px solid #3a3f5c; border-radius: 6px;
            box-shadow: 0 0 40px rgba(80,120,255,.25), inset 0 0 20px rgba(0,0,0,.6);
            image-rendering: pixelated; 
            max-height: 96%; max-width: 100%; object-fit: contain; /* Авто-масштабирование */
        }
        #hint { display: none; } /* Скрываем текстовую подсказку на мобилках */

        /* Виртуальная крестовина (D-PAD) */
        .dpad { position: relative; width: 140px; height: 140px; }
        .dpad-btn { 
            position: absolute; background: rgba(255,255,255,0.15); 
            border: 2px solid rgba(255,255,255,0.4); border-radius: 8px; z-index: 2;
        }
        .dpad-btn.active { background: rgba(255,255,255,0.6); }
        .dpad-up { top: 0; left: 45px; width: 50px; height: 50px; border-bottom: none; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
        .dpad-down { bottom: 0; left: 45px; width: 50px; height: 50px; border-top: none; border-top-left-radius: 0; border-bottom-left-radius: 0; }
        .dpad-left { top: 45px; left: 0; width: 50px; height: 50px; border-right: none; border-top-right-radius: 0; border-bottom-right-radius: 0; }
        .dpad-right { top: 45px; right: 0; width: 50px; height: 50px; border-left: none; border-top-left-radius: 0; border-bottom-left-radius: 0; }
        .dpad-center { 
            position: absolute; top: 45px; left: 45px; width: 50px; height: 50px; 
            background: rgba(255,255,255,0.15); border: none; z-index: 1; 
        }

        /* Кнопки действий (NES Style) */
        .action-btns { position: relative; width: 140px; height: 140px; }
        .act-btn { 
            position: absolute; width: 50px; height: 50px; border-radius: 50%; 
            background: rgba(255,50,50,0.4); border: 2px solid rgba(255,100,100,0.7);
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 16px; font-weight: bold; text-shadow: 2px 2px 0 #000;
            z-index: 2;
        }
        .act-btn.active { background: rgba(255,50,50,0.8); transform: scale(0.95); }
        .btn-1 { bottom: 0; left: 45px; } /* Огонь */
        .btn-2 { top: 45px; right: 0; background: rgba(255,150,50,0.4); border-color: rgba(255,200,100,0.7); } /* Экскаватор */
        .btn-3 { top: 45px; left: 0; background: rgba(50,150,255,0.4); border-color: rgba(100,200,255,0.7); } /* Мины */
        .btn-4 { top: 0; left: 45px; background: rgba(50,255,50,0.4); border-color: rgba(100,255,100,0.7); } /* Телепорт */
        .btn-2.active { background: rgba(255,150,50,0.8); }
        .btn-3.active { background: rgba(50,150,255,0.8); }
        .btn-4.active { background: rgba(50,255,50,0.8); }
    </style>
</head>
<body>
    <!-- Левая панель: Крестовина -->
    <div class="controls" id="left-controls">
        <div class="dpad" id="dpad-container">
            <div class="dpad-center"></div>
            <div class="dpad-btn dpad-up" data-key="up"></div>
            <div class="dpad-btn dpad-down" data-key="down"></div>
            <div class="dpad-btn dpad-left" data-key="left"></div>
            <div class="dpad-btn dpad-right" data-key="right"></div>
        </div>
    </div>
    
    <!-- Центральная панель: Игра -->
    <div id="wrap">
        <canvas id="gameCanvas" width="792" height="644"></canvas>
    </div>
    
    <!-- Правая панель: Кнопки действий -->
    <div class="controls" id="right-controls">
        <div class="action-btns">
            <div class="act-btn btn-1" data-key="fire">1</div>
            <div class="act-btn btn-2" data-key="dig">2</div>
            <div class="act-btn btn-3" data-key="mine">3</div>
            <div class="act-btn btn-4" data-key="tele">4</div>
        </div>
    </div>

    <!-- Подключение модулей игры в строгом порядке зависимостей -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/input.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/level.js"></script>
    <script src="js/tileart.js"></script>
    <script src="js/sprites.js"></script>
    <script src="js/entities.js"></script>
    <script src="js/game.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/render.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
