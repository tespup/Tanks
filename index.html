<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ТАНКИ 8-БИТ · TELEGRAM EDITION</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/press-start-2p@latest/index.css">
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
touch-action: none;
user-select: none;
-webkit-user-select: none;
-webkit-touch-callout: none;
-webkit-tap-highlight-color: transparent;
}
html, body {
height: var(--tg-viewport-stable-height, 100vh);
width: 100%;
background: #000;
overflow: hidden;
overscroll-behavior: none;
}
body {
background: radial-gradient(circle at 50% 45%, #1b2140 0%, #0a0c18 100%);
display: flex;
flex-direction: row;
justify-content: space-between;
align-items: stretch;
font-family: 'Press Start 2P', monospace;
}
/* Боковые зоны: каждая занимает ровно половину свободного пространства,
содержимое центрируется внутри неё (задачи 3 и 4) */
.controls {
flex: 1 1 0;
min-width: 0;
height: 100%;
display: flex;
align-items: center;
justify-content: center;
position: relative;
z-index: 10;
}
#wrap {
flex: 0 1 auto;
min-width: 0;
height: 100%;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
}
/* Задача 2: canvas растянут по высоте вплотную к верхнему и нижнему краям экрана.
Убраны max-height: 96%, border и border-radius — пустых полос больше нет. */
#gameCanvas {
display: block;
height: 100%;
width: auto;
max-width: 100%;
object-fit: contain;
image-rendering: pixelated;
image-rendering: crisp-edges;
border: none;
border-radius: 0;
box-shadow: 0 0 40px rgba(80, 120, 255, .25);
background: #101018;
}
#hint { display: none; }

/* Аналоговый стик: круглая база 168x168 и плавающая шляпка внутри */
.joystick {
  position: relative;
  width: 168px;
  height: 168px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.18) 100%);
  border: 3px solid rgba(255, 255, 255, 0.35);
  box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
}
/* Декоративные насечки по сторонам света на базе стика */
.joystick::before,
.joystick::after {
  content: '';
  position: absolute;
  background: rgba(255, 255, 255, 0.12);
  pointer-events: none;
}
.joystick::before {
  width: 100%;
  height: 2px;
}
.joystick::after {
  width: 2px;
  height: 100%;
}
/* Сам кружочек (шляпка стика), за который тянет палец */
.joystick-knob {
  position: absolute;
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.22));
  border: 3px solid rgba(255, 255, 255, 0.75);
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.55), inset 0 -4px 6px rgba(0, 0, 0, 0.25);
  pointer-events: none;
  z-index: 2;
  transition: transform 0.12s ease-out, background 0.12s;
  will-change: transform;
}
.joystick.active .joystick-knob {
  /* Когда палец двигает стик, отключаем плавную задержку, чтобы он следовал за пальцем мгновенно */
  transition: none;
  background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.4));
  border-color: #fff;
}

/* Кнопки действий: увеличены до 78x78, контейнер 196x196, центрируются в правой зоне */
.action-btns {
position: relative;
width: 196px;
height: 196px;
}
.act-btn {
position: absolute;
width: 78px;
height: 78px;
border-radius: 50%;
border: 3px solid rgba(255, 255, 255, 0.50);
color: #fff;
font-family: inherit;
font-size: 22px;
line-height: 1;
display: flex;
align-items: center;
justify-content: center;
z-index: 2;
text-shadow: 2px 2px 0 #000;
box-shadow: 0 5px 0 rgba(0, 0, 0, 0.45), inset 0 -6px 0 rgba(0, 0, 0, 0.25);
background: #a03030;
}
.act-btn.active {
transform: scale(0.95);
filter: brightness(1.35);
}
.btn-1 { left: 59px;  top: 118px; background: #a03030; }
.btn-2 { left: 118px; top: 59px;  background: #b06020; }
.btn-3 { left: 0;     top: 59px;  background: #2060a0; }
.btn-4 { left: 59px;  top: 0;     background: #208030; }

/* Страховка для узких экранов: элементы управления уменьшаются, оставаясь по центрам зон */
@media (max-width: 860px) {
  .joystick { transform: scale(0.8); }
  .action-btns { transform: scale(0.8); }
}

/* Скрытие сенсорных кнопок на ПК (клавиатура/мышь) */
@media (hover: hover) and (pointer: fine) {
.controls {
display: none !important;
}
#wrap {
flex: 1 1 auto;
width: 100%;
}
}
#rotate-overlay {
display: none;
position: fixed;
inset: 0;
background: #0a0c18;
color: #fff;
z-index: 99999;
flex-direction: column;
align-items: center;
justify-content: center;
text-align: center;
padding: 20px;
font-family: 'Press Start 2P', monospace;
font-size: 14px;
line-height: 1.8;
}
@media screen and (orientation: portrait) and (hover: none) and (pointer: coarse) {
#rotate-overlay {
display: flex;
}
}
</style>
</head>
<body>
<div id="rotate-overlay">
<div>ПОВЕРНИТЕ ТЕЛЕФОН<br>ГОРИЗОНТАЛЬНО</div>
</div>
<div class="controls" id="left-controls">
  <div class="joystick" id="joystick-container">
    <div class="joystick-knob" id="joystick-knob"></div>
  </div>
</div>
<div id="wrap">
<canvas id="gameCanvas" width="792" height="644"></canvas>
<div id="hint"></div>
</div>
<div class="controls" id="right-controls">
<div class="action-btns">
<div class="act-btn btn-1" data-key="fire">1</div>
<div class="act-btn btn-2" data-key="dig">2</div>
<div class="act-btn btn-3" data-key="mine">3</div>
<div class="act-btn btn-4" data-key="tele">4</div>
</div>
</div>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/theme.js"></script>
<script src="js/particles.js"></script>
<script src="js/level.js"></script>
<script src="js/tileart.js"></script>
<script src="js/sprites.js"></script>
<script src="js/entities.js"></script>
<script src="js/game.js"></script>
<script src="js/menu.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js?v=2"></script>
</body>
</html>
